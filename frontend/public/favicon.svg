<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#20242E"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </radialGradient>
    <linearGradient id="sweep" x1="16" y1="16" x2="24" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9A441" stop-opacity="0"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0.4"/>
    </linearGradient>
    <radialGradient id="blipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3C878" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#D9A441" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D9A441" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Sweep beam wedge -->
  <path d="M16 16 L19.8 5.7 A11 11 0 0 1 25.5 10.5 Z" fill="url(#sweep)"/>

  <!-- Scope rings, fading outward -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#7A8290" stroke-width="1" opacity="0.35"/>
  <circle cx="16" cy="16" r="7.2" fill="none" stroke="#7A8290" stroke-width="1.1" opacity="0.55"/>

  <!-- Crosshair ticks -->
  <line x1="27" y1="16" x2="29.2" y2="16" stroke="#7A8290" stroke-width="1.2" opacity="0.5"/>
  <line x1="2.8" y1="16" x2="5" y2="16" stroke="#7A8290" stroke-width="1.2" opacity="0.5"/>
  <line x1="16" y1="2.8" x2="16" y2="5" stroke="#7A8290" stroke-width="1.2" opacity="0.5"/>
  <line x1="16" y1="27" x2="16" y2="29.2" stroke="#7A8290" stroke-width="1.2" opacity="0.5"/>

  <!-- Origin -->
  <circle cx="16" cy="16" r="1.4" fill="#A9AFBB"/>

  <!-- Sweep line to blip -->
  <line x1="16" y1="16" x2="23" y2="7.6" stroke="#D9A441" stroke-width="1.7" stroke-linecap="round"/>

  <!-- Blip: glow, lock-on ring, core -->
  <circle cx="23" cy="7.6" r="5.5" fill="url(#blipGlow)"/>
  <circle cx="23" cy="7.6" r="3" fill="none" stroke="#F3C878" stroke-width="0.9" opacity="0.8"/>
  <circle cx="23" cy="7.6" r="1.7" fill="#F3C878"/>
</svg>
