<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14171c" />
    <meta name="description" content="OutPost — cross-platform behavioral security monitoring, dynamic malware analysis, and campaign hunting." />
    <title>OutPost — Behavioral Security Monitor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme, font, title, and density before first paint.
      (function () {
        try {
          var saved = localStorage.getItem("outpost-theme-v2");
          document.documentElement.dataset.theme = saved || "dark";
          var pal = localStorage.getItem("outpost-palette");
          if (pal) document.documentElement.dataset.palette = pal;
          var font = localStorage.getItem("outpost-font-mono");
          if (font) document.documentElement.dataset.fontMono = font;
          var density = localStorage.getItem("outpost-ui-density");
          if (density) document.documentElement.dataset.uiDensity = density;
          var customTitle = localStorage.getItem("outpost-custom-title");
          if (customTitle) document.title = customTitle + " — Behavioral Security Monitor";
          // Icon-only rail — restore before paint so the offset never flashes.
          if (localStorage.getItem("outpost-rail") === "collapsed") document.documentElement.dataset.rail = "collapsed";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <!-- Self-hosted IBM Plex (public/fonts/) — no external CDN dependency, so
         the e2e gates and air-gapped SOC deployments never hit fonts.gstatic.com
         (a CDN 404 was once failing the layout sweep). The woff2 files ship with
         the repo. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
