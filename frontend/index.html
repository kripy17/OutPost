<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1a" />
    <meta name="description" content="OutPost — cross-platform behavioral security monitoring, dynamic malware analysis, and campaign hunting." />
    <title>OutPost — Behavioral Security Monitor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme before first paint — Midnight Ops is the default identity.
      // Legacy ids ("dark"/"light") map onto their successor themes; see
      // src/lib/themes.ts (the registry the app reads back).
      (function () {
        var THEMES = { midnight: 1, glass: 1, paper: 1, terminal: 1, ember: 1 };
        var theme = "midnight";
        try {
          var saved = localStorage.getItem("outpost-theme-v2");
          if (saved === "dark") theme = "ember";
          else if (saved === "light") theme = "paper";
          else if (saved && THEMES[saved]) theme = saved;
          localStorage.setItem("outpost-theme-v2", theme);
        } catch (e) { /* storage unavailable — keep default */ }
        document.documentElement.dataset.theme = theme;
        // Icon-only rail — restore before paint so the offset never flashes.
        try {
          if (localStorage.getItem("outpost-rail") === "collapsed") document.documentElement.dataset.rail = "collapsed";
        } catch (e) { /* noop */ }
      })();
    </script>
    <!-- Self-hosted IBM Plex (public/fonts/) — no external CDN dependency, so
         the e2e gates and air-gapped SOC deployments never hit fonts.gstatic.com
         (a CDN 404 was once failing the layout sweep). The woff2 files ship with
         the repo. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
