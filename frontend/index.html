<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10131a" />
    <meta name="description" content="OutPost — cross-platform behavioral security monitoring, dynamic malware analysis, and campaign hunting." />
    <title>OutPost — Behavioral Security Monitor</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Theme before first paint — avoids a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem("outpost-theme");
          if (saved !== "light" && saved !== "dark") {
            saved = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = saved;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
