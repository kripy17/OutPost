name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly self-heal: recompute the badges even if a push-run's refresh
    # step ever failed (Monday 05:00 UTC). Runs on the default branch.
    - cron: '0 5 * * 1'

jobs:
  verify:
    name: verify.sh — backend · collectors · CLI · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch / schedule run the refresh job instead of the full sweep.
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    permissions:
      contents: write  # the badge-refresh step commits badges/*.json on main
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            cli/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create venv + install backend & CLI
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "./backend[dev]" -e ./cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Fast-fail on frontend type errors (tsc only)
        # The build step inside verify.sh runs `tsc --noEmit && vite build`;
        # this gate runs just the typecheck so a type error fails the push
        # right after npm ci (~1 min in), before the Playwright download, the
        # badge check, and the 3.5-min sweep. No emitted files, no vite run.
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Install demo deps (Playwright — layout sweep gate)
        working-directory: demo
        run: |
          npm ci
          npx playwright install chromium

      - name: Fast-fail on stale badges (cheap collect-only gate)
        # Front-loads the badge/README claim check: a stale payload fails the
        # push in ~1 minute instead of after the full 3.5-min sweep. --check
        # is collect-only (pytest --collect-only + vitest list) — seconds,
        # not a test run. verify.sh re-checks it later inside its own
        # doc-count step, so nothing is skipped, just failed earlier.
        run: bash scripts/refresh-badges.sh --check

      - name: Run the full verification sweep
        run: bash verify.sh

      - name: Publish dynamic badges (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: bash scripts/refresh-badges.sh --commit

  # The deploy surface: build the production web image and validate the TLS
  # proxy config on every push/PR. Catches Caddyfile syntax drift, frontend
  # builds that break inside the node:20-alpine image, and compose/env
  # interpolation regressions (the single-quote gotcha) before a server sees
  # them. Runs in parallel with the verify sweep.
  deploy:
    name: Deploy — web image + Caddyfile + compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - name: Build the production web image
        # Build context is the repo ROOT (Dockerfile.web copies frontend/ and
        # deploy/). Runs a real npm ci + vite build inside the container, so a
        # frontend change that builds locally but not in the alpine image
        # fails here.
        run: docker build -f deploy/Dockerfile.web -t outpost-web:ci .

      - name: Validate the Caddyfile
        # caddy validate provisions the config without starting the server.
        # OUTPOST_HOST must be set or the {$OUTPOST_HOST} placeholder expands
        # to empty and the site address is invalid. The backend:8001 upstream
        # is not dialed during validation.
        run: |
          docker run --rm \
            -e OUTPOST_HOST=outpost.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate the production compose file
        # Parses + interpolates with the shipped env shape; catches YAML
        # errors and the unquoted-interpolation bug class without needing
        # images built or a backend running.
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.example config -q

  # The strongest air-gap proof: build a full-stack test image, then run the
  # four-gate bundle + both e2e gates inside a container whose network
  # namespace is EMPTY (--network none). Only loopback exists, so any attempt
  # to reach an external host — by any library or technique — fails at the OS
  # level, not just at the in-process probes' simulation level.
  airgap-offline:
    name: Air-gap — full bundle in a --network none container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - name: Build the air-gap CI image
        # Installs backend+CLI into a venv, npm ci + vite build for the
        # frontend, and Playwright+Chromium for the e2es — all at build time
        # (network available), so the runtime test runs with zero egress.
        run: docker build -f deploy/Dockerfile.airgap-ci -t outpost-airgap-ci .

      - name: Run the air-gap bundle at production volume, network namespace empty
        # OUTPOST_OFFLINE_VOLUME=1 seeds a deterministic ~11k-event store
        # (scripts/seed_volume.py) so the guarantee is proven at production
        # scale on every push — the volume run surfaced the 15MB /campaigns
        # payload that the tiny-store runs never would.
        run: docker run --network none --rm -e OUTPOST_OFFLINE_VOLUME=1 outpost-airgap-ci bash scripts/airgap-offline.sh

  # On-demand badge refresh — no code push needed. Dispatch this workflow and
  # it recomputes the three counts from main and publishes any change.
  refresh-badges:
    name: Refresh dynamic badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Create venv + install backend & CLI
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "./backend[dev]" -e ./cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Refresh and publish badges
        run: bash scripts/refresh-badges.sh --commit
