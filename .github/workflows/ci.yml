name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly self-heal: recompute the badges even if a push-run's refresh
    # step ever failed (Monday 05:00 UTC). Runs on the default branch.
    - cron: '0 5 * * 1'

jobs:
  verify:
    name: verify.sh — backend · collectors · CLI · frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # workflow_dispatch / schedule run the refresh job instead of the full sweep.
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'schedule'
    permissions:
      contents: write  # the badge-refresh step commits badges/*.json on main
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            cli/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Create venv + install backend & CLI
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "./backend[dev]" -e ./cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run the full verification sweep
        run: bash verify.sh

      - name: Publish dynamic badges (main only)
        if: github.ref == 'refs/heads/main' && success()
        run: bash scripts/refresh-badges.sh --commit

  # On-demand badge refresh — no code push needed. Dispatch this workflow and
  # it recomputes the three counts from main and publishes any change.
  refresh-badges:
    name: Refresh dynamic badges
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Create venv + install backend & CLI
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e "./backend[dev]" -e ./cli

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Refresh and publish badges
        run: bash scripts/refresh-badges.sh --commit
