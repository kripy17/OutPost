[project]
name = "outpost-cli"
version = "0.1.0"
description = "OutPost — terminal interface for the behavioral security monitor"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "requests>=2.31",
    "plyer>=2.1",
    "pyfiglet>=1.0",
]

[project.scripts]
outpost = "outpost.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["outpost*"]
