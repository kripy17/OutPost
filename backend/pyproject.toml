[project]
name = "outpost-backend"
version = "0.1.0"
description = "OutPost — cross-platform behavioral security monitor, FastAPI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "requests>=2.31",
    "httpx>=0.27",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.models", "app.services", "app.tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
